[package]
name = "nes_launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
nes_emulator = { path = ".." }
egui_extras = "0.32.3"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
sdl2 = "0.38.0"